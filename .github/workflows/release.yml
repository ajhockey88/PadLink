name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: xcodegen
      - name: Build unsigned
        working-directory: iOS
        run: |
          xcodebuild -project PadLink.xcodeproj -scheme PadLink \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        working-directory: iOS
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PadLink.app Payload/
          zip -qr PadLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: iOS/PadLink.ipa }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install vgamepad pyinstaller
      - run: pyinstaller --onefile --name PadLinkReceiver --collect-all vgamepad Windows/padlink_receiver.py
      - uses: actions/upload-artifact@v4
        with: { name: receiver, path: dist/PadLinkReceiver.exe }

  release:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: |
            out/PadLink.ipa
            out/PadLinkReceiver.exe
          generate_release_notes: true
