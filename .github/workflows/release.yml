name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: xcodegen
      - name: Build unsigned
        working-directory: iOS
        run: |
          xcodebuild -project PadLink.xcodeproj -scheme PadLink \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        working-directory: iOS
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PadLink.app Payload/
          zip -qr PadLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: iOS/PadLink.ipa }

  release:
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Package Windows receiver
        run: |
          cp Windows/padlink_receiver.py Windows/install_startup.ps1 out/
          echo vgamepad > out/requirements.txt
          cd out && zip PadLinkReceiver.zip padlink_receiver.py install_startup.ps1 requirements.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.9' }}
          files: |
            out/PadLink.ipa
            out/PadLinkReceiver.zip
          generate_release_notes: true
