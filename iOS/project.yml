name: PadLink
options:
  bundleIdPrefix: com.example
targets:
  PadLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [PadLink]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PadLink
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Find your PC and send controller input to it."
        NSBonjourServices: ["_padlink._udp"]
    settings:
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.example.padlink
